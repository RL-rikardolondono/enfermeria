# Blueprint de Render para la API de enfermería domiciliaria (plan gratuito)
services:
  - type: web
    name: enfermeria-api
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm run build
    startCommand: npm run start:render
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL        # Cadena de conexión de Neon (Postgres gratis)
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://rl-rikardolondono.github.io
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: WOMPI_PUBLIC_KEY
        sync: false
      - key: WOMPI_INTEGRITY_SECRET
        sync: false
